[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read-write", path = "../deployments" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120

[fuzz]
runs = 32
