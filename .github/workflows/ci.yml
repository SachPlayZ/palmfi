name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      # Fork tests read a pinned Arc block. The RPC state cache is saved even when tests fail, and retries with
      # backoff keep the public RPC's rate limit (429) out of CI.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-arc-71037000-${{ github.run_id }}
          restore-keys: foundry-rpc-arc-71037000-
      - run: >-
          forge test -vv --jobs 2 --fork-url "$ARC_RPC_URL" --fork-block-number "$FORK_BLOCK"
          --fork-retries 10 --fork-retry-backoff 3000 --compute-units-per-second 300
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL || 'https://rpc.testnet.arc.network' }}
          FORK_BLOCK: 71037000
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-arc-71037000-${{ github.run_id }}

  cre:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # One bun workspace (cre/package.json): shared (palm constants + deviation model),
      # sentinel and reconciler. Typecheck and test every package.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Compile the Sentinel and Reconciler to WASM exactly as `cre workflow simulate` does
      # (cre-compile runs the SDK's runtime-compat and determinism checks).
      - run: bun run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
