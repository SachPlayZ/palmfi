name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}

  cre:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # One bun workspace (cre/package.json): hello, shared (palm constants + decision engine),
      # sentinel and reconciler. Typecheck and test every package.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Compile the Sentinel and Reconciler to WASM exactly as `cre workflow simulate` does
      # (cre-compile runs the SDK's runtime-compat and determinism checks).
      - run: bun run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
